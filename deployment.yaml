apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-ui
  template:
    metadata:
      labels:
        app: frontend-ui
    spec:
      containers:
        - name: frontend-ui
          image: kapilacr2026.azurecr.io/frontend-ui:v15
          ports:
            - containerPort: 5000
          env:
            - name: QUERY_SERVICE_URL
              value: "http://telemetry-query-service/api/v1/fleet/telemetry"