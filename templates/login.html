<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FleetOps | Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top left,
                    #1e293b,
                    #0f172a 45%,
                    #020617
                );

            color: #ffffff;
        }

        .login-container {

            width: 100%;
            max-width: 420px;

            padding: 20px;
        }

        .login-card {

            background: rgba(15, 23, 42, 0.96);

            border: 1px solid rgba(148, 163, 184, 0.18);

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45);

        }

        .logo {

            text-align: center;

            margin-bottom: 10px;

            font-size: 30px;

            font-weight: 800;

            letter-spacing: -1px;
        }

        .logo span {

            color: #38bdf8;
        }

        .subtitle {

            text-align: center;

            color: #94a3b8;

            margin-bottom: 32px;

            font-size: 14px;
        }

        .form-group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 14px;

            font-weight: 600;
        }

        input {

            width: 100%;

            padding: 13px 14px;

            border-radius: 9px;

            border: 1px solid #334155;

            background: #020617;

            color: #ffffff;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {

            border-color: #38bdf8;

            box-shadow:
                0 0 0 3px rgba(56, 189, 248, 0.12);
        }

        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #0ea5e9;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {

            background: #0284c7;
        }

        .error {

            background: rgba(239, 68, 68, 0.12);

            border: 1px solid rgba(239, 68, 68, 0.3);

            color: #fca5a5;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;
        }

        .credentials {

            margin-top: 24px;

            padding: 12px;

            border-radius: 8px;

            background: rgba(30, 41, 59, 0.7);

            color: #94a3b8;

            font-size: 12px;

            text-align: center;
        }

        .credentials strong {

            color: #cbd5e1;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                Fleet<span>Ops</span>
            </div>

            <div class="subtitle">
                Fleet Monitoring Platform
            </div>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('login') }}"
            >

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                        autocomplete="username"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <div class="credentials">

                Demo credentials:<br>

                <strong>admin</strong> /
                <strong>admin123</strong>

            </div>

        </div>

    </div>

</body>

</html>
